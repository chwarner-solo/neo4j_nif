name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5-community
        ports:
          - 7687:7687
        env:
          NEO4J_AUTH: neo4j/testpassword
          NEO4J_ACCEPT_LICENSE_AGREEMENT: yes
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-elixir@v1
        with:
          elixir-version: "1.15"
          otp-version: "26"
      - run: mix deps.get
      - run: mix test

  build_and_release_nifs:
    name: Build NIF for ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use-cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use-cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            use-cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            use-cross: false
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            use-cross: false
    steps:
      - uses: actions/checkout@v4
      - name: Get version from tag
        shell: bash
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build NIF
        id: build_nif
        uses: philss/rustler-precompiled-action@v1.0.1
        with:
          project-name: neo4j_nif
          project-version: ${{ env.APP_VERSION }}
          target: ${{ matrix.target }}
          nif-version: "2.16" # For OTP 26
          use-cross: ${{ matrix.use-cross }}
          project-dir: "native/neo4j_nif"
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ steps.build_nif.outputs.file-path }}
            ${{ steps.build_nif.outputs.checksum-file-path }}

  publish_to_hex:
    name: Publish to Hex
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build_and_release_nifs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-elixir@v1
        with:
          elixir-version: "1.15"
          otp-version: "26"
      - run: mix deps.get
      - run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
